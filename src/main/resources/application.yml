spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
    connect-retries-interval: 3

server:
  port: 8080

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:college-documents}
    region: ${AWS_S3_REGION:}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
  model: ${OLLAMA_MODEL:nomic-embed-text}
  chat-model: ${OLLAMA_CHAT_MODEL:llama3.2}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-minimum-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs
